<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact | ColakCode</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css"> <!-- senin ana stil dosyan -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/3/w3.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/topnav.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="jquery-3.5.1.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/load_content.js"></script>

<style>
/* -------- FORM ALANI CSS -------- */

.form-container {
  max-height: calc(100vh - 120px); /* Üst navbar + alt footer boşluk */
  overflow-y: auto;
  padding-bottom: 5px;
  padding-top: 25px;
}

.contact-container {
  max-width: 700px;
  margin: 90px auto 20px auto; /* topbar için boşluk */
  padding: 20px;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 0 12px rgba(0,0,0,0.12);
}

.contact-container h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #333;
}

.contact-form .group {
  margin-bottom: 18px;
}

.contact-form label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  color: #444;
}

.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  box-sizing: border-box;
}

.contact-form textarea {
  resize: vertical;
  min-height: 120px;
}

.submit-btn {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  background: #2c89a0;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.submit-btn:hover {
  background: #256f80;
}

#form-status {
  margin-top: 15px;
  text-align: center;
  font-weight: 600;
  display: none;
}

/* topbar boşluğu için */
.topnav {
  margin-bottom: 20px;
}
</style>
</head>

<body>

<!-- ========== TOPBAR ========== -->
<nav class="topnav" id="myTopnav">
  <a href="index.html">Home</a>

  <a class="sitename" href="https://www.colakcode.com">
    <img src="/media/icons/colakcode_white.png"/>
  </a>
</nav>


<!-- ========== FORM ALANI ========== -->
 <div class="form-container">
<div class="contact-container">
  <h2 style="font-family: 'baloo'; font-weight: bold;">Contact Me</h2>

  <form id="contactForm" class="contact-form">

    <div class="group">
      <label>Name *</label>
      <input type="text" id="name" required maxlength="40">
    </div>

    <div class="group">
      <label>Email *</label>
      <input type="email" id="email" required maxlength="80">
    </div>

    <div class="group">
      <label>Subject *</label>
      <input type="text" id="subject" required maxlength="100">
    </div>

    <div class="group">
      <label>Message *</label>
      <textarea id="message" required maxlength="1000"></textarea>
        <div id="messageCounter">0 / 1000</div>
    </div>

    <button type="submit" class="submit-btn">Send Message</button>

    <div id="form-status"></div>
  </form>
</div>
</div>


<!-- ========== FOOTER ========== -->
<footer class="w3-container w3-padding-16 w3-center w3-xlarge footer" style="position: fixed; bottom:0; width: 100%;">
  <a href="https://www.github.com/colakcode"><img class="footimg" src="/media/icons/svg/github.svg"></a>
  <a href="https://play.google.com/store/apps/dev?id=8107760137135745209&hl=en_US"><img class="footimg" style="width:30px;height:30px" src="/media/icons/svg/google-play.svg"></a>
  <a href="https://www.instagram.com/clkapps"><img style="width:30px;height:30px;" src="/media/icons/svg/instagram.svg"></a>
  <a href="https://www.youtube.com/channel/UCyPbxL_8RbQrqEHuaNQ6Yyg"><img style="width:30px;height:30px;" src="/media/icons/svg/youtube.svg"></a>
  <a href="https://www.artstation.com/colakart"><img style="width:30px;height:30px;" src="/media/icons/svg/artstation.svg"></a>
  <a href="https://sketchfab.com/kemalcolak"><img style="width:35px;height:35px;vertical-align:-4%;" src="/media/icons/svg/sketchfab.svg"></a>
  <p><a id="link" href="https://github.com/colakcode/">@colakcode on GitHub</a></p>
</footer>


<!-- ========== JAVASCRIPT (BB) ========== -->
<script>
function responsiveNavigation() {
  var x = document.getElementById("myTopnav");
  if (x.className === "topnav") x.className += " responsive";
  else x.className = "topnav";
}

const WORKER_URL = "https://form-backend.colakcode.workers.dev";  // <-- BURAYI DEĞİŞTİR

document.getElementById("contactForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const status = document.getElementById("form-status");
  status.style.display = "block";
  status.style.color = "#555";
  status.innerText = "Sending...";

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const subject = document.getElementById("subject").value.trim();
  const message = document.getElementById("message").value.trim();



    function isValidName() {
      return name.length > 0;
    }

    if (!isValidName()) {
      status.style.color = "red";
      status.innerText = "Please enter your name.";
      return;
    }



  // ----------- FIELD VALIDATION -----------
  if (!email || !message) {
    status.style.color = "red";
    status.innerText = "Please fill in all required fields.";
    return;
  }

  // Email format doğrulaması
  if (!isValidEmail(email)) {
    status.style.color = "red";
    status.innerText = "Please enter a valid email address.";
    return;
  }

  const body = { name, email, subject, message };

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    // 🔥 RATE LIMIT UYARISI
    if (res.status === 429) {
      status.style.color = "red";
      status.innerText = "You have reached the message limit. Please try again in 20 minutes.";
      return;
    }

    if (res.ok) {
      status.style.color = "green";
      status.innerText = "Message sent ✔";
      document.getElementById("contactForm").reset();
      document.getElementById("messageCounter").innerText = "0 / 1000";
    } else {
      status.style.color = "red";
      status.innerText = "Error sending message!";
    }

  } catch (err) {
    status.style.color = "red";
    status.innerText = "Connection error!";
  }
});

// E-mail doğrulama fonksiyonu
function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

const message = document.getElementById("message");
const counter = document.getElementById("messageCounter");

message.addEventListener("input", () => {
  const len = message.value.length;
  counter.innerText = `${len} / 1000`;
});


</script>

</body>
</html>
